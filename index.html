<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solar Chat</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #000000;
      overflow: hidden;
    }

    .chat-container {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background-color: #000000;
      background-image: 
        linear-gradient(rgba(240, 232, 213, 0.18) 1px, transparent 1px),
        linear-gradient(90deg, rgba(240, 232, 213, 0.18) 1px, transparent 1px);
      background-size: 20px 20px;
      position: relative;
    }

    /* Chat Header */
    .chat-header {
      background-color: #111111;
      color: #F0E8D5;
      padding: 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 2px solid #F0E8D5;
      flex-shrink: 0;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: #F0E8D5;
      color: #111111;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      border: none;
      overflow: hidden;
      flex-shrink: 0;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Dropdown Menu - Svuotato/Disabilitato */
    .menu-container {
      position: relative;
    }

    .menu-btn {
      background: none;
      border: none;
      color: #F0E8D5;
      font-size: 18px;
      cursor: pointer;
      padding: 5px;
    }

    .dropdown-menu {
      display: none;
    }

    /* Messages Area */
    .chat-messages {
      flex: 1;
      padding: 20px 20px 120px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .message-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      max-width: 85%;
    }

    .message-row.received {
      align-self: flex-start;
    }

    .message-row.sent {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .msg-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #F0E8D5;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }

    .msg-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .message-content {
      display: flex;
      flex-direction: column;
    }

    .sender-name {
      font-size: 11px;
      font-weight: bold;
      color: #F0E8D5;
      margin-bottom: 3px;
      padding-left: 4px;
      text-shadow: 1px 1px 2px #000;
    }

    .sent .sender-name {
      text-align: right;
      padding-right: 4px;
    }

    .message-bubble {
      padding: 10px 14px;
      border-radius: 15px;
      font-size: 15px;
      line-height: 1.4;
      position: relative;
      border: 2px solid #F0E8D5;
    }

    .received .message-bubble {
      background-color: #111111;
      color: #F0E8D5;
      border-bottom-left-radius: 2px;
      box-shadow: 2px 2px 0px #F0E8D5;
    }

    .sent .message-bubble {
      background-color: #F0E8D5;
      color: #111111;
      border-bottom-right-radius: 2px;
      box-shadow: 2px 2px 0px #555555;
    }

    .message-img {
      max-width: 220px;
      width: 100%;
      height: auto;
      border-radius: 8px;
      border: 2px solid #F0E8D5;
      margin-top: 6px;
      display: block;
      box-shadow: 2px 2px 0px #000;
    }
  </style>
</head>
<body>

  <div class="chat-container">
    <div class="chat-header">
      <div class="user-info">
        <i class="fa-solid fa-chevron-left"></i>
        <div class="avatar">
          <img src="https://raw.githubusercontent.com/gura-code/Story/refs/heads/main/%E2%80%8Bgruppo-pianeti.png" alt="Group" onerror="this.style.display='none'; this.parentNode.innerText='SUN';">
        </div>
        <div>
          <span style="font-weight: bold; display: block; font-size: 14px;">Solar Chat</span>
          <span style="font-size: 11px; color: #F0E8D5; opacity: 0.7;">Sun, Mercury, Venus, Earth, Mars, Jupiter...</span>
        </div>
      </div>
      <div class="menu-container">
        <button class="menu-btn" id="menuToggle"><i class="fa-solid fa-bars"></i></button>
        <div class="dropdown-menu" id="dropdownMenu"></div>
      </div>
    </div>

    <div class="chat-messages" id="chatBox"></div>
  </div>

  <script>
    const profileImages = {
      'The Sun [Admin]': './sole.png',
      'Mercury': './mercurio.png',
      'Venus': './venere.png',
      'Earth': './terra.png',
      'Mars': './marte.png',
      'Jupiter': 'https://science.nasa.gov/wp-content/uploads/2024/03/jupiter-marble-pia22946-16x9-1.jpg',
      'Saturn': 'https://assets.science.nasa.gov/dynamicimage/assets/science/psd/solar/2023/07/titan_carousel2.jpg?w=800&h=600&fit=clip&crop=faces%2Cfocalpoint',
      'Uranus': 'https://assets.science.nasa.gov/dynamicimage/assets/science/cds/general/images/2024/03/uranus-pia18182-16x9-1.jpg?w=1920&h=1080&fit=clip&crop=faces%2Cfocalpoint',
      'Neptune': 'https://science.nasa.gov/wp-content/uploads/2024/03/pia01492-neptune-full-disk-16x9-1.jpg?resize=1024,576',
      'Pluto': 'https://science.nasa.gov/wp-content/uploads/2024/03/pia01492-neptune-full-disk-16x9-1.jpg?resize=1024,576'
    };

    const messagesData = [
      { type: 'system', text: 'The Sun added Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus, Neptune.' },
      { type: 'text', sender: 'received', name: 'The Sun [Admin]', text: 'SILENCE. Gravity is stable, orbits are circular, no one leaves their track. Good rotation.' },
      { type: 'text', sender: 'received', name: 'Mercury', text: 'GUYS IT\'S HOT. IT\'S HOT IT\'S HOT IT\'S HOT. CAN SOMEONE MOVE ME FURTHER AWAY? PLEASE.' },
      { type: 'text', sender: 'received', name: 'Venus', text: 'Stop crying, Mercury. Look at how gorgeous I look in Earth\'s skies tonight. Bright, elegant, flawless.' },
      { type: 'text', sender: 'sent', name: 'Earth', text: 'Venus, your atmosphere is made of sulfuric acid and the pressure would crush a submarine. Stop acting like a diva.' },
      { type: 'text', sender: 'received', name: 'Mars', text: 'Speaking of parasites... Earth, I got another wheeled robot. They keep digging holes in my desert looking for water. But there is no water! It\'s just dust! I\'ve been saying this for three billion years!' },
      { type: 'image', sender: 'received', name: 'Mars', text: '<i>Curiosity rover chilling in the Martian dust</i>', img: './rover-marte.png' },
      { type: 'text', sender: 'sent', name: 'Earth', text: 'Don\'t blame me, I don\'t drive them. They do it themselves. Besides, one of them took a sunset photo the other day and it was objectively gorgeous.' },
      { type: 'text', sender: 'received', name: 'Jupiter', text: 'Ahahaha. Look at the cute little rocky planets. You\'re so small I could fit all of you inside my Great Red Spot and still have room for three moons.' },
      { type: 'image', sender: 'received', name: 'Jupiter', text: '<i>The giant spinning storm in high definition</i>', img: './tempesta-giove.gif' },
      { type: 'text', sender: 'received', name: 'Saturn', text: 'Hey big guy, speak for yourself. Look at my rings. Pure, magnificent, shining ice crystals. Nobody has fashion accessories like mine within ten astronomical units.' },
      { type: 'text', sender: 'received', name: 'Uranus', text: 'Guys... have you ever thought about how we\'re all just spinning in circles around a giant ball of fire for no real reason?' },
      { type: 'text', sender: 'received', name: 'Neptune', text: 'Yeah... and it\'s freezing out here. Look out there into the deep universe, it\'s totally insane.' },
      { type: 'image', sender: 'received', name: 'Neptune', text: '<i>Deep Field Space</i>', img: './galassie-lontane.png' },
      { type: 'text', sender: 'received', name: 'The Sun [Admin]', text: 'Mercury, minus 5 reputation points for the noise. Behave or I\'ll shut down nuclear fusion.' },
      { type: 'image', sender: 'received', name: 'The Sun [Admin]', text: '<i>Prohibition Card</i>', img: './carta-nera.png' },
      { type: 'text', sender: 'sent', name: 'Earth', text: '...does anyone have an aspirin? I think global warming is doing weird things.' },
      { type: 'text', sender: 'received', name: 'Mars', text: 'Serves you right for being so picky with liquid water. Go buy an AC unit.' },
      { type: 'text', sender: 'received', name: 'Jupiter', text: 'Speaking of warming... Earth, your tenants sent another noisy piece of iron out this morning. It flew past Ganymede and made a super annoying beep.' },
      { type: 'text', sender: 'sent', name: 'Earth', text: 'Really? Where is it going?' },
      { type: 'text', sender: 'received', name: 'Jupiter', text: 'Dunno, looks like it\'s leaving the solar system. Say goodbye to your kids, they\'re all grown up and want to explore the universe.' },
      { type: 'text', sender: 'received', name: 'Venus', text: 'So cute, thinking they can go anywhere with that fossil fuel tech. Fools.' },
      { type: 'text', sender: 'received', name: 'Uranus', text: 'By the way, what happened to Pluto? Why does he never write in the chat?' },
      { type: 'text', sender: 'received', name: 'Saturn', text: 'He got kicked out of the group because he didn\'t meet the minimum mass requirements. Now he hangs out at the Kuiper Belt Club drinking frozen methane cocktails with his weird friends.' },
      { type: 'text', sender: 'received', name: 'Neptune', text: 'Ah, so I\'m not the only one ignored at galaxy meetups. Good to know.' },
      { type: 'text', sender: 'received', name: 'Mercury', text: 'Guys, I have a rotation lock. I\'m spinning terribly, I feel so nauseous. Sun, can I take a break? Just one hour of total darkness?' },
      { type: 'text', sender: 'received', name: 'The Sun [Admin]', text: 'Breaks don\'t exist in deep space, Mercury. Keep spinning.' },
      { type: 'text', sender: 'received', name: 'Mars', text: 'Hey Sun, instead of playing UV dictator, did you check if my ice caps grew this year? I\'ve been on a strict solid carbon dioxide diet.' },
      { type: 'text', sender: 'received', name: 'The Sun [Admin]', text: 'I don\'t look at your dust, Mars. I have a nebula to manage three light-years away.' },
      { type: 'image', sender: 'received', name: 'The Sun [Admin]', text: '<i>Pillars of Creation flex</i>', img: './pilastri-creazione.png' },
      { type: 'text', sender: 'sent', name: 'Earth', text: 'Guys seriously, there\'s a giant asteroid heading straight for the Pacific. Can someone help me deflect it?' },
      { type: 'text', sender: 'received', name: 'Jupiter', text: 'Don\'t worry Earth, I got it with my gravity. Puff... done. I redirected it toward Venus.' },
      { type: 'text', sender: 'received', name: 'Venus', text: 'WHAT?! ARE YOU INSANE?! IT MISSED ME BY AN INCH! I ALMOST RUINED MY FINISH!' },
      { type: 'text', sender: 'received', name: 'Jupiter', text: 'Oops. My mass slipped. Ahahaha.' },
      { type: 'text', sender: 'received', name: 'Uranus', text: 'Guys, I\'ve been rolling on my side for four billion years and nobody ever tells me "Uranus, get comfortable". You\'re terrible neighbors.' },
      { type: 'text', sender: 'received', name: 'Neptune', text: 'I feel you bro. It\'s so quiet out here I can actually hear my own rings freezing.' },
      { type: 'text', sender: 'sent', name: 'Earth', text: 'Well, I\'m turning off the lights. My humans are sleeping and it\'s dead boring. Tomorrow I might invent another ice age just to spice things up.' },
      { type: 'text', sender: 'received', name: 'Mars', text: 'Let me know if you find a good deal on used rovers. My porch is full of them. Night rocks.' }
    ];

    const chatBox = document.getElementById('chatBox');

    function renderAllMessages() {
      chatBox.innerHTML = '';
      messagesData.forEach((msg) => {
        const msgDiv = document.createElement('div');
        
        if (msg.type === 'system') {
          msgDiv.style.textAlign = 'center';
          msgDiv.style.fontSize = '12px';
          msgDiv.style.color = '#F0E8D5';
          msgDiv.style.opacity = '0.85';
          msgDiv.style.margin = '8px 0';
          msgDiv.style.width = '100%';
          msgDiv.style.textShadow = '1px 1px 2px #000';
          msgDiv.innerHTML = `<i>${msg.text}</i>`;
        } else {
          msgDiv.classList.add('message-row', msg.sender);
          let imgFileName = profileImages[msg.name] || './planet.png';

          let innerContent = `<div>${msg.text}</div>`;
          if (msg.type === 'image') {
            innerContent += `<img src="${msg.img}" alt="Chat Image" class="message-img" onerror="this.src='https://via.placeholder.com/220x140/111/F0E8D5?text=Image';">`;
          }

          msgDiv.innerHTML = `
            <div class="msg-avatar">
              <img src="${imgFileName}" alt="${msg.name}" onerror="this.style.display='none'; this.parentNode.innerText='${msg.name.substring(0,3).toUpperCase()}';">
            </div>
            <div class="message-content">
              <div class="sender-name">${msg.name}</div>
              <div class="message-bubble">
                ${innerContent}
              </div>
            </div>
          `;
        }
        chatBox.appendChild(msgDiv);
      });

      chatBox.scrollTop = chatBox.scrollHeight;
    }

    renderAllMessages();
  </script>
</body>
</html>
