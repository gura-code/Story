<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Gruppo - Sistema Solare</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      /* Sfondo a quadretti in stile taccuino di scuola ma con colori invertiti: sfondo nero e righe bianche */
      background-color: #000000;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.15) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.15) 1px, transparent 1px);
      background-size: 20px 20px;
      overflow-x: hidden;
    }

    .chat-container {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-color: rgba(0, 0, 0, 0.85);
      position: relative;
      border-left: 2px solid #ffffff;
      border-right: 2px solid #ffffff;
      box-shadow: 4px 0px 15px rgba(255,255,255,0.1);
    }

    /* Intestazione Chat (Stile Nero/Bianco) */
    .chat-header {
      background-color: #111111;
      color: white;
      padding: 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 2px solid #ffffff;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: #ffffff;
      color: #111111;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      border: 2px solid #ffffff;
      overflow: hidden;
      flex-shrink: 0;
    }

    /* Area Messaggi */
    .chat-messages {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .message-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      max-width: 85%;
      opacity: 0;
      transform: translateY(10px);
      animation: fadeIn 0.3s forwards ease-in-out;
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message-row.received {
      align-self: flex-start;
    }

    .message-row.sent {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .msg-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #ffffff;
      border: 2px solid #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 8px;
      font-weight: bold;
      color: #111;
      overflow: hidden;
      flex-shrink: 0;
      text-align: center;
      padding: 2px;
      word-break: break-all;
    }

    .message-content {
      display: flex;
      flex-direction: column;
    }

    .sender-name {
      font-size: 11px;
      font-weight: bold;
      color: #cccccc;
      margin-bottom: 3px;
      padding-left: 4px;
    }

    .sent .sender-name {
      text-align: right;
      padding-right: 4px;
    }

    /* Bubble dei messaggi */
    .message-bubble {
      padding: 10px 14px;
      border-radius: 15px;
      font-size: 15px;
      line-height: 1.4;
      position: relative;
      border: 2px solid #ffffff;
    }

    .received .message-bubble {
      background-color: #111111;
      color: #ffffff;
      border-bottom-left-radius: 2px;
      box-shadow: 2px 2px 0px #ffffff;
    }

    .sent .message-bubble {
      background-color: #ffffff;
      color: #000000;
      border-bottom-right-radius: 2px;
      box-shadow: 2px 2px 0px #888888;
    }

    .timestamp {
      font-size: 10px;
      color: #aaaaaa;
      margin-top: 4px;
      text-align: right;
    }
    .sent .timestamp { color: #555555; }

    /* Banner Finale e Pulsanti Social */
    .final-banner {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      margin-top: 20px;
      padding-bottom: 30px;
      animation: fadeIn 0.5s forwards;
    }

    .social-icons {
      display: flex;
      gap: 15px;
    }

    .social-btn {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: #111;
      border: 2px solid #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      text-decoration: none;
      font-size: 18px;
      box-shadow: 2px 2px 0px #ffffff;
    }

    .card-banner {
      background: #111111;
      color: #ffffff;
      border: 2px solid #ffffff;
      border-radius: 12px;
      padding: 15px;
      width: 90%;
      text-align: center;
      box-shadow: 3px 3px 0px #ffffff;
    }

    .card-banner a {
      display: block;
      margin-top: 10px;
      font-weight: bold;
      color: #ffffff;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div class="chat-container">
    <div class="chat-header">
      <div class="user-info">
        <i class="fa-solid fa-chevron-left"></i>
        <div class="avatar">SUN</div>
        <div>
          <span style="font-weight: bold; display: block; font-size: 14px;">IL SISTEMA SOLARE - GRUPPO UFFICIALE</span>
          <span style="font-size: 11px; color: #aaa;">Sole, Mercurio, Venere, Terra, Marte, Giove...</span>
        </div>
      </div>
      <div>
        <i class="fa-solid fa-magnifying-glass" style="margin-right: 15px;"></i>
        <i class="fa-solid fa-bars"></i>
      </div>
    </div>

    <div class="chat-messages" id="chatBox"></div>

    <div class="final-banner" id="finalBanner">
      <div class="social-icons">
        <a href="#" class="social-btn"><i class="fa-brands fa-x-twitter"></i></a>
        <a href="#" class="social-btn"><i class="fa-solid fa-comment"></i></a>
        <a href="#" class="social-btn"><i class="fa-brands fa-facebook-f"></i></a>
      </div>
      <div class="card-banner">
        <p><i>"Esplora l'universo e scopri la storia dei pianeti..."</i></p>
        <a href="#">Torna al taccuino COSMIC-S &rarr;</a>
      </div>
    </div>
  </div>

  <script>
    // Nomi dei file .png impostati come richiesto per le foto profilo
    const profileImages = {
      'Il Sole [Admin]': 'sole.png',
      'Mercurio': 'mercurio.png',
      'Venere': 'venere.png',
      'Terra': 'terra.png',
      'Marte': 'marte.png',
      'Giove': 'giove.png',
      'Saturno': 'saturno.png',
      'Urano': 'urano.png',
      'Nettuno': 'nettuno.png',
      'Sistema': 'sistema.png'
    };

    const messagesData = [
      { type: 'system', text: 'Il Sole ha aggiunto Mercurio, Venere, Terra, Marte, Giove, Saturno, Urano, Nettuno.', time: '12:00', delay: 500 },
      { type: 'text', sender: 'received', name: 'Il Sole [Admin]', text: '@tutti SILENZIO. La gravità è stabile, le orbite sono circolari, nessuno deve uscire dal tracciato. Buona rotazione.', time: '12:01', delay: 1500 },
      { type: 'text', sender: 'received', name: 'Mercurio', text: 'RAGAZZI HO CALDO. HO CALDO HO CALDO HO CALDO. QUALCUNO MI SPOSTA PIÙ IN LÀ? VI PREGO.', time: '12:02', delay: 3000 },
      { type: 'text', sender: 'received', name: 'Venere', text: 'Smettila di piangere, Mercurio. Piuttosto, guardate quanto sono splendida stasera nei cieli della Terra. Lucente, elegante, perfetta.', time: '12:03', delay: 4500 },
      { type: 'text', sender: 'sent', name: 'Terra', text: 'Venere, hai un\'atmosfera fatta di acido solforico e una pressione che schiaccerebbe un sottomarino. Fai meno la diva.', time: '12:04', delay: 6000 },
      { type: 'text', sender: 'received', name: 'Venere', text: 'Invidia acida, Terra. Almeno io non ho parassiti intelligenti che mi camminano sulla crosta e mi riempiono di lattine di Coca-Cola vuote.', time: '12:05', delay: 7500 },
      { type: 'text', sender: 'received', name: 'Marte', text: 'A proposito di parassiti... Terra, mi è arrivato l\'ennesimo robottino con le ruote. Continuano a scavare buche nel mio deserto alla ricerca di acqua. Ma se non c\'è acqua! È polvere! Sono tre miliardi di anni che lo ripeto!', time: '12:06', delay: 9000 },
      { type: 'text', sender: 'sent', name: 'Terra', text: 'Non prendertela con me, io non li piloto. Fanno tutto da soli. Anzi, l\'altro giorno uno di loro ha fatto una foto al tramonto ed era oggettivamente bellissimo.', time: '12:07', delay: 10500 },
      { type: 'text', sender: 'received', name: 'Giove', text: 'Ahahahahah. Che teneri i pianeti rocciosi. Siete così piccoli che vi metto tutti insieme dentro la mia macchia rossa e mi avanzano pure tre lune di spazio.', time: '12:08', delay: 12000 },
      { type: 'text', sender: 'received', name: 'Saturno', text: 'Ehi, ciccione, parla per te. Guarda i miei anelli. Cristalli di ghiaccio puri, magnifici, splendenti. Nessuno ha degli accessori moda come i miei nel raggio di dieci unità astronomiche.', time: '12:09', delay: 13500 },
      { type: 'text', sender: 'received', name: 'Urano', text: 'Raga... ma voi avete mai pensato che giriamo tutti in cerchio intorno a una palla di fuoco gigante senza un vero motivo?', time: '12:10', delay: 15000 },
      { type: 'text', sender: 'received', name: 'Nettuno', text: 'Già... e fa un freddo cane qui fuori. Non sento più le dita. Ah, aspetta, io non ho le dita.', time: '12:11', delay: 16500 },
      { type: 'text', sender: 'received', name: 'Mercurio', text: 'RAGAZZI IL SOLE SI È AVVICINATO DI UN MILLIMETRO O È UN\'IMPRESSIONE MIA? STO SCIOGLIENDO.', time: '12:12', delay: 18000 },
      { type: 'text', sender: 'received', name: 'Il Sole [Admin]', text: 'Mercurio, meno 5 punti reputazione per il disturbo. Fate i bravi o spengo la fusione nucleare.', time: '12:13', delay: 19500 },
      { type: 'text', sender: 'sent', name: 'Terra', text: '...qualcuno ha un\'aspirina? Sento che il riscaldamento globale sta facendo cose strane.', time: '12:14', delay: 21000 },
      { type: 'text', sender: 'received', name: 'Marte', text: 'Ti sta bene, così impari a fare la preziosa con l\'acqua liquida. Vatti a comprare un climatizzatore.', time: '12:15', delay: 22500 },
      { type: 'text', sender: 'received', name: 'Giove', text: 'A proposito di riscaldamento... Terra, i tuoi inquilini hanno mandato fuori un altro pezzo di ferro rumoroso stamattina. Mi è passato vicino a Ganimede e ha fatto un beep fastidiosissimo.', time: '12:16', delay: 24000 },
      { type: 'text', sender: 'sent', name: 'Terra', text: 'Davvero? E dove va?', time: '12:17', delay: 25500 },
      { type: 'text', sender: 'received', name: 'Giove', text: 'Boh, credo stia uscendo dal sistema solare. Saluta i tuoi figli, ormai sono grandi e vogliono esplorare il mondo.', time: '12:18', delay: 27000 },
      { type: 'text', sender: 'received', name: 'Venere', text: 'Ma che tenerezza, credono di poter andare da qualche parte con quella tecnologia a combustione fossile. Sciocchi.', time: '12:19', delay: 28500 },
      { type: 'text', sender: 'received', name: 'Urano', text: 'A proposito, ma Plutone che fine ha fatto? Perché non scrive mai in chat?', time: '12:20', delay: 30000 },
      { type: 'text', sender: 'received', name: 'Saturno', text: 'È stato escluso dal gruppo perché non rispettava i requisiti minimi di massa. Adesso vaga nel Kuiper Belt Club a bere cocktail di metano ghiacciato con i suoi amichetti sfigati.', time: '12:21', delay: 31500 },
      { type: 'text', sender: 'received', name: 'Nettuno', text: 'Ah, quindi non sono l\'unico a non essere considerato nei meetup di galassia. Ottimo a sapersi.', time: '12:22', delay: 33000 },
      { type: 'text', sender: 'received', name: 'Mercurio', text: 'Raga, ho un blocco della rotazione. Sto girando malissimo, ho una nausea incredibile. Sole, posso fare una pausa? Anche solo un\'ora di buio totale?', time: '12:23', delay: 34500 },
      { type: 'text', sender: 'received', name: 'Il Sole [Admin]', text: 'La pausa non esiste nel vuoto cosmico, Mercurio. Continua a girare.', time: '12:24', delay: 36000 },
      { type: 'text', sender: 'received', name: 'Marte', text: 'Senti Sole, ma invece di fare il dittatore coi raggi UV, hai mica visto se le calotte polari mi sono cresciute quest\'anno? Ho fatto una dieta a base di anidride carbonica solida.', time: '12:25', delay: 37500 },
      { type: 'text', sender: 'received', name: 'Il Sole [Admin]', text: 'Non guardo la tua polvere, Marte. Ho una nebulosa da gestire a tre anni luce da qui.', time: '12:26', delay: 39000 },
      { type: 'text', sender: 'sent', name: 'Terra', text: 'Ragazzi, seriamente, c\'è un asteroide gigante che mi sta puntando dritto contro la crosta pacifica. Qualcuno mi aiuta a deviarlo?', time: '12:27', delay: 40500 },
      { type: 'text', sender: 'received', name: 'Giove', text: 'Tranquilla Terra, ci penso io con la mia gravità. Puff... fatto. L\'ho deviato verso Venere.', time: '12:28', delay: 42000 },
      { type: 'text', sender: 'received', name: 'Venere', text: 'COSA?! MA SEI SCEMO?! MI HA MANCATO UN CAPELLO! HO RISCHIATO DI ROVINARMI LA BRUNITURA!', time: '12:29', delay: 43500 },
      { type: 'text', sender: 'received', name: 'Giove', text: 'Ops. Mi è scivolata la massa. Ahahaha.', time: '12:30', delay: 45000 },
      { type: 'text', sender: 'received', name: 'Urano', text: 'Ragazzi, sto ruotando di sbieco da quattro miliardi di anni e nessuno che mi dica "Urano, stai comodo". Siete dei pessimi vicini di casa.', time: '12:31', delay: 46500 },
      { type: 'text', sender: 'received', name: 'Nettuno', text: 'Ti capisco fratello. Qui fuori c\'è così tanto silenzio che sento i miei stessi anelli che si congelano.', time: '12:32', delay: 48000 },
      { type: 'text', sender: 'sent', name: 'Terra', text: 'Va beh, vado a spegnere la luce. I miei umani stanno dormendo e c\'è una noia mortale. Domani mi sa che invento un\'altra era glaciale per movimentare la situazione.', time: '12:33', delay: 49500 },
      { type: 'text', sender: 'received', name: 'Marte', text: 'Fammi sapere se becchi una buona offerta per i robottini usati. Ne ho la veranda piena. Notte sassi.', time: '12:34', delay: 51000 }
    ];

    const chatBox = document.getElementById('chatBox');
    const finalBanner = document.getElementById('finalBanner');

    function addMessage(msg) {
      const msgDiv = document.createElement('div');
      
      if (msg.type === 'system') {
        msgDiv.style.textAlign = 'center';
        msgDiv.style.fontSize = '12px';
        msgDiv.style.color = '#aaaaaa';
        msgDiv.style.margin = '8px 0';
        msgDiv.style.width = '100%';
        msgDiv.innerHTML = `<i>${msg.text}</i>`;
      } else {
        msgDiv.classList.add('message-row', msg.sender);
        
        let pngName = profileImages[msg.name] || 'pianeta.png';

        msgDiv.innerHTML = `
          <div class="msg-avatar">${pngName}</div>
          <div class="message-content">
            <div class="sender-name">${msg.name}</div>
            <div class="message-bubble">
              <div>${msg.text}</div>
              <div class="timestamp">${msg.time}</div>
            </div>
          </div>
        `;
      }

      chatBox.appendChild(msgDiv);
      window.scrollTo(0, document.body.scrollHeight);
    }

    messagesData.forEach((msg, index) => {
      setTimeout(() => {
        addMessage(msg);
        
        if (index === messagesData.length - 1) {
          setTimeout(() => {
            finalBanner.style.display = 'flex';
            window.scrollTo(0, document.body.scrollHeight);
          }, 1500);
        }
      }, msg.delay);
    });
  </script>
</body>
</html>
