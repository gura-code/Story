<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COSMIC-S // Special Chat</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #f5f5f7;
      background-image: 
        linear-gradient(#e1e1e6 1px, transparent 1px),
        linear-gradient(90deg, #e1e1e6 1px, transparent 1px);
      background-size: 20px 20px;
      color: #111111;
      font-family: 'Quicksand', sans-serif;
      padding: 30px 10px;
      display: flex;
      justify-content: center;
      position: relative;
    }

    .site-wrapper {
      max-width: 980px;
      width: 100%;
      background: #ffffff;
      border: 3px solid #111111;
      border-radius: 32px;
      padding: 20px;
      margin-bottom: 30px;
      box-shadow: 6px 6px 0px #111111;
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: relative;
      overflow: hidden;
    }

    .top-banner {
      background: #111111;
      border: 2px solid #111111;
      border-radius: 20px;
      padding: 12px 25px;
      display: flex;
      justify-content: flex-start;
      align-items: center;
      position: relative;
    }

    .top-banner h1 { 
      font-size: 3.5rem; 
      font-weight: 800; 
      letter-spacing: 3px; 
      color: #ffffff;
      text-align: left;
      line-height: 1;
      text-shadow: 0 0 10px rgba(255,255,255,0.9), 0 0 20px rgba(255,255,255,0.6);
    }

    .grid-container {
      display: grid;
      grid-template-columns: minmax(180px, 240px) minmax(220px, 1fr) minmax(160px, 220px);
      gap: 12px;
      align-items: stretch;
      padding-bottom: 20px;
      width: 100%;
    }

    .col-left, .col-center, .col-right {
      display: flex;
      flex-direction: column;
      position: relative;
      min-width: 0;
    }

    .paper-note-container {
      width: 100%;
      margin-bottom: 14px;
      display: flex;
      justify-content: center;
    }

    .paper-note-img {
      width: 100%;
      height: auto;
      display: block;
      filter: drop-shadow(3px 3px 0px rgba(0,0,0,0.15));
    }

    .box {
      background: #ffffff;
      border: 2px solid #111111;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 3px 3px 0px #111111;
      margin-bottom: 14px;
    }
    .box-header {
      background: #f0f0f3;
      border-bottom: 2px solid #111111;
      padding: 8px 14px;
      font-weight: 700;
      font-size: 0.8rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .box-body { padding: 14px; }

    .box-dark {
      background: #111111;
      color: #ffffff;
      border: 2px solid #111111;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 3px 3px 0px #111111;
      margin-bottom: 14px;
    }
    .box-dark .box-header {
      background: #222222;
      color: #ffffff;
      border-bottom: 2px solid #444444;
    }

    .receipt-box {
      background: #ffffff;
      border: 2px solid #111111;
      padding: 18px 14px;
      box-shadow: 4px 4px 0px #111111;
      margin-bottom: 14px;
      transform: rotate(-2deg);
    }
    .receipt-title { text-align: center; font-weight: 800; font-size: 0.85rem; }
    .receipt-dash { border: none; border-top: 2px dashed #111; margin: 10px 0; }
    .receipt-menu-list { list-style: none; display: flex; flex-direction: column; gap: 6px; }
    .receipt-menu-list a {
      color: #111; text-decoration: none; font-weight: 700; font-size: 0.78rem; display: block; padding: 8px 10px; cursor: pointer;
    }
    .receipt-menu-list a.active, .receipt-menu-list a:hover { background: #111111; color: #ffffff; }
    .receipt-barcode { text-align: center; font-size: 1.1rem; letter-spacing: 2px; margin-top: 8px; }

    .calendar-graphic-dark { 
      width: 36px; height: 36px; border: 2px solid #fff; border-radius: 6px; background: #222; margin: 0 auto 8px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 2px 2px 0px #fff;
    }
    .calendar-graphic-top-dark { background: #fff; height: 10px; width: 100%; }
    .calendar-graphic-body-dark { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 800; color: #fff; }

    .mini-calendar-dark { width: 100%; font-size: 0.68rem; text-align: center; border-collapse: collapse; }
    .mini-calendar-dark th, .mini-calendar-dark td { padding: 4px 2px; border: none; color: #ffffff; }
    .mini-calendar-dark th { background: #333333; font-size: 0.6rem; font-weight: 800; border-radius: 4px; }
    .mini-calendar-dark td.today-dark { background: #ffffff; color: #111111; font-weight: 800; border-radius: 4px; }

    .pixel-clock-box-dark {
      background: #111; border: 2px solid #111; border-radius: 16px; padding: 12px; text-align: center; box-shadow: 3px 3px 0px #111; margin-bottom: 14px;
    }
    .pixel-clock-time-dark {
      font-family: 'Press Start 2P', monospace; font-size: 0.85rem; color: #fff; letter-spacing: 1px;
    }

    .nav-box-btn {
      width: 100%; background: #ffffff; border: 2px solid #111; border-radius: 16px; padding: 10px; font-weight: 800; font-size: 0.75rem; cursor: pointer; box-shadow: 3px 3px 0px #111; text-align: center; margin-bottom: 14px; text-decoration: none; color: #111; display: block;
    }
    .nav-box-btn-dark {
      width: 100%; background: #111111; color: #ffffff; border: 2px solid #111; border-radius: 16px; padding: 10px; font-weight: 800; font-size: 0.75rem; cursor: pointer; box-shadow: 3px 3px 0px #111; text-align: center; margin-bottom: 14px; text-decoration: none; display: block;
    }

    /* STILI INTEGRATI PER LA CHAT INTERATTIVA NELLA COLONNA CENTRALE */
    .chat-simulation-box {
      background: #8daebb;
      border: 3px solid #111111;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 4px 4px 0px #111111;
      display: flex;
      flex-direction: column;
      margin-bottom: 14px;
    }

    .chat-header-sim {
      background-color: #2b3a42;
      color: white;
      padding: 12px 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid #111;
    }

    .user-info-sim {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar-sim {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background-color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #2b3a42;
      font-weight: bold;
      font-size: 0.8rem;
    }

    .chat-messages-sim {
      padding: 12px;
      max-height: 350px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message-sim {
      max-width: 85%;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 0.85rem;
      line-height: 1.4;
      opacity: 0;
      transform: translateY(10px);
      animation: fadeInMsg 0.3s forwards ease-in-out;
      border: 1px solid #111;
    }

    @keyframes fadeInMsg {
      to { opacity: 1; transform: translateY(0); }
    }

    .message-sim.received {
      align-self: flex-start;
      background-color: #ffffff;
      color: #000;
      border-bottom-left-radius: 2px;
    }

    .message-sim.sent {
      align-self: flex-end;
      background-color: #f7e665;
      color: #000;
      border-bottom-right-radius: 2px;
    }

    .timestamp-sim {
      font-size: 9px;
      color: #555;
      margin-top: 3px;
      text-align: right;
    }

    .audio-player-sim {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .play-btn-sim {
      background-color: #000;
      color: #fff;
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
    }

    .final-banner-sim {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 15px;
      background: #ffffff;
      border-top: 2px solid #111;
    }

    .social-icons-sim {
      display: flex;
      gap: 12px;
    }

    .social-btn-sim {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      box-shadow: 2px 2px 0px #555;
    }

    .card-banner-sim {
      background: #f0f0f3;
      border: 2px solid #111;
      border-radius: 10px;
      padding: 10px;
      width: 100%;
      text-align: center;
      font-size: 0.78rem;
    }
    .card-banner-sim a {
      display: block; margin-top: 6px; font-weight: bold; color: #111; text-decoration: none;
    }

    .site-footer { border-top: 2px solid #111; padding-top: 12px; text-align: center; font-weight: 700; font-size: 0.72rem; color: #555; }
    .pure-card-img { max-width: 100%; display: block; filter: drop-shadow(4px 4px 0px #111); }
  </style>
</head>
<body>

  <div class="site-wrapper">

    <header class="top-banner">
      <h1>COSMIC-S</h1>
    </header>

    <div class="grid-container">

      <aside class="col-left">
        <div class="receipt-box">
          <div class="receipt-title">.☘︎ ݁˖ MENU ☰ ❞</div>
          <hr class="receipt-dash">
          <ul class="receipt-menu-list">
            <li><a class="active">˙ᵕ˙ HOME</a></li>
            <li><a href="#">LOGS &amp; BLOG ✐ᝰ</a></li>
            <li><a href="#">GALLERY ⋆˚꩜｡</a></li>
            <li><a href="#">STORIES</a></li>
          </ul>
          <hr class="receipt-dash">
          <div class="receipt-barcode">𝄃𝄃𝄂𝄂𝄀𝄁𝄃𝄂𝄂𝄃</div>
        </div>

        <div class="box-dark">
          <div class="box-header"><span id="cal-month-title">calendar</span></div>
          <div class="box-body">
            <div class="calendar-graphic-dark">
              <div class="calendar-graphic-top-dark"></div>
              <div class="calendar-graphic-body-dark" id="cal-day-number">--</div>
            </div>
            <table class="mini-calendar-dark">
              <thead>
                <tr><th>S</th><th>M</th><th>T</th><th>W</th><th>T</th><th>F</th><th>S</th></tr>
              </thead>
              <tbody id="calendar-body"></tbody>
            </table>
          </div>
        </div>
      </aside>

      <main class="col-center">
        <div style="margin-bottom: 14px;">
          <img src="./about-me-card.png" alt="about_me.id" class="pure-card-img" onerror="this.style.height='150px'; this.style.background='#ddd';">
        </div>

        <div class="chat-simulation-box">
          <div class="chat-header-sim">
            <div class="user-info-sim">
              <div class="avatar-sim">KF</div>
              <span style="font-weight: bold; font-size: 0.85rem;">Koharu Fuyutsuki</span>
            </div>
            <div>
              <i class="fa-solid fa-phone" style="font-size: 0.8rem;"></i>
            </div>
          </div>

          <div class="chat-messages-sim" id="chatBoxSim"></div>

          <div class="final-banner-sim" id="finalBannerSim">
            <div class="social-icons-sim">
              <a href="#" class="social-btn-sim"><i class="fa-brands fa-x-twitter"></i></a>
              <a href="#" class="social-btn-sim"><i class="fa-solid fa-comment"></i></a>
              <a href="#" class="social-btn-sim"><i class="fa-brands fa-facebook-f"></i></a>
            </div>
            <div class="card-banner-sim">
              <p><i>"Unisciti a noi e scopri la storia..."</i></p>
              <a href="#">Vai al sito ufficiale &rarr;</a>
            </div>
          </div>
        </div>
      </main>

      <aside class="col-right">
        <div class="pixel-clock-box-dark">
          <div class="pixel-clock-time-dark" id="pixel-clock">00:00:00</div>
        </div>

        <a href="https://gura-code.atabook.org" target="_blank" class="nav-box-btn">
          ✎ SIGN GUESTBOOK -&gt;
        </a>

        <div class="box-dark">
          <div class="box-header"><span>live_chat</span></div>
          <div class="box-body" style="padding: 6px; background: #111;">
            <iframe src="https://www5.cbox.ws/box/?boxid=965960&boxtag=EoeC0G" width="100%" height="200" frameborder="0"></iframe>
          </div>
        </div>
      </aside>

    </div>

    <footer class="site-footer">
      COSMIC-S // HOSTED ON NEOCITIES // ALL RIGHTS RESERVED
    </footer>

  </div>

  <script>
    // Dati dei messaggi della chat in stile Line
    const messagesData = [
      { type: 'text', sender: 'received', text: 'Grazie per oggi!', time: '20:45', delay: 1000 },
      { type: 'text', sender: 'sent', text: 'Di cosa parli?', time: '21:00', delay: 2500 },
      { type: 'text', sender: 'received', text: 'Sì, esatto', time: '21:12', delay: 4000 },
      { type: 'text', sender: 'sent', text: 'Come si fa?', time: '21:13', delay: 5500 },
      { 
        type: 'audio', 
        sender: 'sent', 
        audioUrl: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3', 
        time: '21:13', 
        delay: 7000 
      },
      { type: 'text', sender: 'received', text: 'Hai mandato un vocale!', time: '21:15', delay: 9000 },
      { type: 'text', sender: 'sent', text: 'Posso cancellarlo?', time: '21:15', delay: 10500 },
      { 
        type: 'audio', 
        sender: 'received', 
        audioUrl: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3', 
        time: '21:16', 
        delay: 12000 
      }
    ];

    const chatBoxSim = document.getElementById('chatBoxSim');
    const finalBannerSim = document.getElementById('finalBannerSim');

    function addMessageSim(msg) {
      const msgDiv = document.createElement('div');
      msgDiv.classList.add('message-sim', msg.sender);

      if (msg.type === 'text') {
        msgDiv.innerHTML = `
          <div>${msg.text}</div>
          <div class="timestamp-sim">${msg.time}</div>
        `;
      } else if (msg.type === 'audio') {
        msgDiv.innerHTML = `
          <div class="audio-player-sim">
            <button class="play-btn-sim" onclick="playAudioSim('${msg.audioUrl}', this)">
              <i class="fa-solid fa-play"></i>
            </button>
            <span>Vocale</span>
          </div>
          <div class="timestamp-sim">${msg.time}</div>
        `;
      }

      chatBoxSim.appendChild(msgDiv);
      chatBoxSim.scrollTop = chatBoxSim.scrollHeight;
    }

    let currentAudioSim = null;
    let currentBtnSim = null;

    function playAudioSim(url, btn) {
      if (currentAudioSim) {
        currentAudioSim.pause();
        if (currentBtnSim) currentBtnSim.innerHTML = '<i class="fa-solid fa-play"></i>';
      }

      if (currentBtnSim === btn && !currentAudioSim.paused) {
        return;
      }

      currentAudioSim = new Audio(url);
      currentBtnSim = btn;
      btn.innerHTML = '<i class="fa-solid fa-pause"></i>';
      currentAudioSim.play();

      currentAudioSim.onended = () => {
        btn.innerHTML = '<i class="fa-solid fa-play"></i>';
      };
    }

    messagesData.forEach((msg, index) => {
      setTimeout(() => {
        addMessageSim(msg);
        
        if (index === messagesData.length - 1) {
          setTimeout(() => {
            finalBannerSim.style.display = 'flex';
            chatBoxSim.scrollTop = chatBoxSim.scrollHeight;
          }, 1500);
        }
      }, msg.delay);
    });

    // Orologio e Calendario
    function generateCalendar() {
      const today = new Date();
      const currentDay = today.getDate();
      const currentMonth = today.getMonth();
      const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

      document.getElementById('cal-month-title').innerText = monthNames[currentMonth].toLowerCase();
      document.getElementById('cal-day-number').innerText = currentDay;

      const firstDayOfMonth = new Date(today.getFullYear(), currentMonth, 1).getDay();
      const daysInMonth = new Date(today.getFullYear(), currentMonth + 1, 0).getDate();
      const tbody = document.getElementById('calendar-body');
      tbody.innerHTML = '';

      let date = 1;
      for (let i = 0; i < 6; i++) {
        let row = document.createElement('tr');
        let hasDate = false;

        for (let j = 0; j < 7; j++) {
          let cell = document.createElement('td');
          if (i === 0 && j < firstDayOfMonth) {
            cell.innerText = '';
          } else if (date > daysInMonth) {
            cell.innerText = '';
          } else {
            cell.innerText = date;
            if (date === currentDay) { cell.classList.add('today-dark'); }
            date++;
            hasDate = true;
          }
          row.appendChild(cell);
        }
        if (hasDate || i === 0) { tbody.appendChild(row); }
      }
    }

    function updatePixelClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('pixel-clock').innerText = `${hours}:${minutes}:${seconds}`;
    }

    generateCalendar();
    setInterval(updatePixelClock, 1000);
    updatePixelClock();
  </script>
</body>
</html>
