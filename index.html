<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Gruppo - Sistema Solare</title>
  <!-- Icone FontAwesome per tasti Play e Social -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #fdfbf7;
      overflow-x: hidden;
    }

    .chat-container {
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-color: #fdfbf7;
      position: relative;
    }

    /* Intestazione Chat (Stile Nero/Bianco) */
    .chat-header {
      background-color: #111111;
      color: white;
      padding: 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 2px solid #111;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: #ffffff;
      color: #111111;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      border: 2px solid #111;
    }

    /* Area Messaggi */
    .chat-messages {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Bubble dei messaggi (Palette Taccuino) */
    .message {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 15px;
      font-size: 15px;
      line-height: 1.4;
      position: relative;
      opacity: 0;
      transform: translateY(10px);
      animation: fadeIn 0.3s forwards ease-in-out;
      border: 2px solid #111111;
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .sender-name {
      font-size: 11px;
      font-weight: bold;
      color: #444;
      margin-bottom: 3px;
    }

    .message.received {
      align-self: flex-start;
      background-color: #ffffff;
      color: #111;
      border-bottom-left-radius: 2px;
      box-shadow: 2px 2px 0px #111;
    }

    .message.sent {
      align-self: flex-end;
      background-color: #111111;
      color: #ffffff;
      border-bottom-right-radius: 2px;
      box-shadow: 2px 2px 0px #444;
    }

    .timestamp {
      font-size: 10px;
      color: #777;
      margin-top: 4px;
      text-align: right;
    }
    .sent .timestamp { color: #aaa; }

    /* Player Audio */
    .audio-player {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .play-btn {
      background-color: #111;
      color: #fff;
      border: 1px solid #111;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .sent .play-btn { background-color: #fff; color: #111; }

    /* Banner Finale e Pulsanti Social */
    .final-banner {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      margin-top: 20px;
      padding-bottom: 30px;
      animation: fadeIn 0.5s forwards;
    }

    .social-icons {
      display: flex;
      gap: 15px;
    }

    .social-btn {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: white;
      border: 2px solid #111;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #111;
      text-decoration: none;
      font-size: 18px;
      box-shadow: 2px 2px 0px #111;
    }

    .card-banner {
      background: white;
      border: 2px solid #111;
      border-radius: 12px;
      padding: 15px;
      width: 90%;
      text-align: center;
      box-shadow: 3px 3px 0px #111;
    }

    .card-banner a {
      display: block;
      margin-top: 10px;
      font-weight: bold;
      color: #111;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div class="chat-container">
    <!-- Intestazione Chat di Gruppo -->
    <div class="chat-header">
      <div class="user-info">
        <i class="fa-solid fa-chevron-left"></i>
        <div class="avatar"><i class="fa-solid fa-globe"></i></div>
        <div>
          <span style="font-weight: bold; display: block; font-size: 14px;">Solar System Group</span>
          <span style="font-size: 11px; color: #aaa;">Mercury, Venus, Earth, Mars, Saturn...</span>
        </div>
      </div>
      <div>
        <i class="fa-solid fa-magnifying-glass" style="margin-right: 15px;"></i>
        <i class="fa-solid fa-bars"></i>
      </div>
    </div>

    <!-- Contenitore Messaggi -->
    <div class="chat-messages" id="chatBox"></div>

    <!-- Banner Finale -->
    <div class="final-banner" id="finalBanner">
      <div class="social-icons">
        <a href="#" class="social-btn"><i class="fa-brands fa-x-twitter"></i></a>
        <a href="#" class="social-btn"><i class="fa-solid fa-comment"></i></a>
        <a href="#" class="social-btn"><i class="fa-brands fa-facebook-f"></i></a>
      </div>
      <div class="card-banner">
        <p><i>"Esplora l'universo e scopri la storia dei pianeti..."</i></p>
        <a href="#">Torna al taccuino COSMIC-S &rarr;</a>
      </div>
    </div>
  </div>

  <script>
    const messagesData = [
      { type: 'text', sender: 'received', name: 'Mercury', text: 'Ragazzi, avete controllato gli ultimi aggiornamenti sul taccuino?', time: '14:02', delay: 1000 },
      { type: 'text', sender: 'received', name: 'Venus', text: 'Sì! La nuova veste grafica in bianco e nero è bellissima ✨', time: '14:03', delay: 2500 },
      { type: 'text', sender: 'sent', name: 'Earth (Tu)', text: 'Esatto, ho sistemato i colori per abbinarli allo stile crema!', time: '14:05', delay: 4000 },
      { type: 'text', sender: 'received', name: 'Mars', text: 'Ottimo lavoro, era ora di dare una scossa al sistema.', time: '14:06', delay: 5500 },
      { 
        type: 'audio', 
        sender: 'received', 
        name: 'Saturn', 
        audioUrl: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3', 
        time: '14:08', 
        delay: 7000 
      },
      { type: 'text', sender: 'received', name: 'Jupiter', text: 'Ascoltate questo vocale che ha mandato Saturno con gli anelli!', time: '14:09', delay: 9000 },
      { type: 'text', sender: 'sent', name: 'Earth (Tu)', text: 'Ricevuto! Perfetto così.', time: '14:10', delay: 10500 }
    ];

    const chatBox = document.getElementById('chatBox');
    const finalBanner = document.getElementById('finalBanner');

    function addMessage(msg) {
      const msgDiv = document.createElement('div');
      msgDiv.classList.add('message', msg.sender);

      let contentHTML = `<div class="sender-name">${msg.name}</div>`;

      if (msg.type === 'text') {
        contentHTML += `
          <div>${msg.text}</div>
          <div class="timestamp">${msg.time}</div>
        `;
      } else if (msg.type === 'audio') {
        contentHTML += `
          <div class="audio-player">
            <button class="play-btn" onclick="playAudio('${msg.audioUrl}', this)">
              <i class="fa-solid fa-play"></i>
            </button>
            <span>Messaggio Vocale</span>
          </div>
          <div class="timestamp">${msg.time}</div>
        `;
      }

      msgDiv.innerHTML = contentHTML;
      chatBox.appendChild(msgDiv);
      window.scrollTo(0, document.body.scrollHeight);
    }

    let currentAudio = null;
    let currentBtn = null;

    function playAudio(url, btn) {
      if (currentAudio) {
        currentAudio.pause();
        if (currentBtn) currentBtn.innerHTML = '<i class="fa-solid fa-play"></i>';
      }

      if (currentBtn === btn && !currentAudio.paused) {
        return;
      }

      currentAudio = new Audio(url);
      currentBtn = btn;
      btn.innerHTML = '<i class="fa-solid fa-pause"></i>';
      currentAudio.play();

      currentAudio.onended = () => {
        btn.innerHTML = '<i class="fa-solid fa-play"></i>';
      };
    }

    messagesData.forEach((msg, index) => {
      setTimeout(() => {
        addMessage(msg);
        
        if (index === messagesData.length - 1) {
          setTimeout(() => {
            finalBanner.style.display = 'flex';
            window.scrollTo(0, document.body.scrollHeight);
          }, 1500);
        }
      }, msg.delay);
    });
  </script>
</body>
</html>
