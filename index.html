<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solar Chat</title>
  <!-- Icone FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #000000;
      overflow: hidden;
    }

    .chat-container {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background-color: #000000;
      background-image: 
        linear-gradient(rgba(240, 232, 213, 0.18) 1px, transparent 1px),
        linear-gradient(90deg, rgba(240, 232, 213, 0.18) 1px, transparent 1px);
      background-size: 20px 20px;
      position: relative;
    }

    /* Intestazione Chat */
    .chat-header {
      background-color: #111111;
      color: #F0E8D5;
      padding: 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 2px solid #F0E8D5;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: #F0E8D5;
      color: #111111;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      border: 2px solid #F0E8D5;
      overflow: hidden;
      flex-shrink: 0;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Menu a tendina per saltare l'animazione */
    .menu-container {
      position: relative;
    }

    .menu-btn {
      background: none;
      border: none;
      color: #F0E8D5;
      font-size: 18px;
      cursor: pointer;
      padding: 5px;
    }

    .dropdown-menu {
      display: none;
      position: absolute;
      right: 0;
      top: 35px;
      background-color: #111111;
      border: 2px solid #F0E8D5;
      border-radius: 8px;
      width: 220px;
      box-shadow: 3px 3px 0px #F0E8D5;
      z-index: 100;
    }

    .dropdown-menu.active {
      display: block;
    }

    .dropdown-item {
      padding: 12px 15px;
      color: #F0E8D5;
      font-size: 13px;
      cursor: pointer;
      border-bottom: 1px solid rgba(240, 232, 213, 0.2);
      text-decoration: none;
      display: block;
    }

    .dropdown-item:last-child {
      border-bottom: none;
    }

    .dropdown-item:hover {
      background-color: rgba(240, 232, 213, 0.1);
    }

    /* Area Messaggi */
    .chat-messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .message-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      max-width: 85%;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.3s, transform 0.3s;
    }

    .message-row.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .message-row.received {
      align-self: flex-start;
    }

    .message-row.sent {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .msg-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #F0E8D5;
      border: 2px solid #F0E8D5;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }

    .msg-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .message-content {
      display: flex;
      flex-direction: column;
    }

    .sender-name {
      font-size: 11px;
      font-weight: bold;
      color: #F0E8D5;
      margin-bottom: 3px;
      padding-left: 4px;
      text-shadow: 1px 1px 2px #000;
    }

    .sent .sender-name {
      text-align: right;
      padding-right: 4px;
    }

    .message-bubble {
      padding: 10px 14px;
      border-radius: 15px;
      font-size: 15px;
      line-height: 1.4;
      position: relative;
      border: 2px solid #F0E8D5;
    }

    .received .message-bubble {
      background-color: #111111;
      color: #F0E8D5;
      border-bottom-left-radius: 2px;
      box-shadow: 2px 2px 0px #F0E8D5;
    }

    .sent .message-bubble {
      background-color: #F0E8D5;
      color: #111111;
      border-bottom-right-radius: 2px;
      box-shadow: 2px 2px 0px #555555;
    }

    .message-img {
      max-width: 220px;
      width: 100%;
      height: auto;
      border-radius: 8px;
      border: 2px solid #F0E8D5;
      margin-top: 6px;
      display: block;
      box-shadow: 2px 2px 0px #000;
    }

    .timestamp {
      font-size: 10px;
      color: #cccccc;
      margin-top: 4px;
      text-align: right;
    }
    .sent .timestamp { color: #444444; }

    .final-banner {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      margin-top: 20px;
      padding-bottom: 30px;
    }

    .final-banner.visible {
      display: flex;
    }

    .social-icons {
      display: flex;
      gap: 15px;
    }

    .social-btn {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: #111;
      border: 2px solid #F0E8D5;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #F0E8D5;
      text-decoration: none;
      font-size: 18px;
      box-shadow: 2px 2px 0px #F0E8D5;
    }

    .card-banner {
      background: #111111;
      color: #F0E8D5;
      border: 2px solid #F0E8D5;
      border-radius: 12px;
      padding: 15px;
      width: 90%;
      max-width: 500px;
      text-align: center;
      box-shadow: 3px 3px 0px #F0E8D5;
    }

    .card-banner a {
      display: block;
      margin-top: 10px;
      font-weight: bold;
      color: #F0E8D5;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div class="chat-container">
    <!-- Intestazione Chat -->
    <div class="chat-header">
      <div class="user-info">
        <i class="fa-solid fa-chevron-left"></i>
        <div class="avatar">
          <img src="gruppo.png" alt="Gruppo" onerror="this.style.display='none'; this.parentNode.innerText='SUN';">
        </div>
        <div>
          <span style="font-weight: bold; display: block; font-size: 14px;">Solar Chat</span>
          <span style="font-size: 11px; color: #F0E8D5; opacity: 0.7;">Sun, Mercury, Venus, Earth, Mars, Jupiter...</span>
        </div>
      </div>
      <div class="menu-container">
        <button class="menu-btn" id="menuToggle"><i class="fa-solid fa-bars"></i></button>
        <div class="dropdown-menu" id="dropdownMenu">
          <div class="dropdown-item" id="instantReadBtn">Visualizza subito tutta la chat</div>
        </div>
      </div>
    </div>

    <!-- Contenitore Messaggi -->
    <div class="chat-messages" id="chatBox"></div>

    <!-- Banner Finale -->
    <div class="final-banner" id="finalBanner">
      <div class="social-icons">
        <a href="#" class="social-btn"><i class="fa-brands fa-x-twitter"></i></a>
        <a href="#" class="social-btn"><i class="fa-solid fa-comment"></i></a>
        <a href="#" class="social-btn"><i class="fa-brands fa-facebook-f"></i></a>
      </div>
      <div class="card-banner">
        <p><i>"Explore the universe and discover the story of the planets..."</i></p>
        <a href="#">Back to COSMIC-S Notebook &rarr;</a>
      </div>
    </div>
  </div>

  <script>
    // NOMI DA ASSEGNARE ALLE IMMAGINI DEL PROFILO:
    // - Immagine profilo del gruppo (in alto a sinistra): "gruppo.png"
    // - Immagini profilo dei singoli partecipanti:
    //   "sole.png", "mercurio.png", "venere.png", "terra.png", "marte.png", "giove.png", "saturno.png", "urano.png", "nettuno.png"
    const profileImages = {
      'The Sun [Admin]': 'sole.png',
      'Mercury': 'mercurio.png',
      'Venus': 'venere.png',
      'Earth': 'terra.png',
      'Mars': 'marte.png',
      'Jupiter': 'giove.png',
      'Saturn': 'saturno.png',
      'Uranus': 'urano.png',
      'Neptune': 'nettuno.png'
    };

    const messagesData = [
      { type: 'system', text: 'The Sun added Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus, Neptune.', time: '12:00' },
      { type: 'text', sender: 'received', name: 'The Sun [Admin]', text: '@everyone SILENCE. Gravity is stable, orbits are circular, no one leaves their track. Good rotation.', time: '12:01' },
      { type: 'text', sender: 'received', name: 'Mercury', text: 'GUYS IT\'S HOT. IT\'S HOT IT\'S HOT IT\'S HOT. CAN SOMEONE MOVE ME FURTHER AWAY? PLEASE.', time: '12:02' },
      { type: 'text', sender: 'received', name: 'Venus', text: 'Stop crying, Mercury. Look at how gorgeous I look in Earth\'s skies tonight. Bright, elegant, flawless.<br>😛 <i>[Sailor Venus sticker]</i>', time: '12:03' },
      { type: 'text', sender: 'sent', name: 'Earth', text: 'Venus, your atmosphere is made of sulfuric acid and the pressure would crush a submarine. Stop acting like a diva.', time: '12:04' },
      { type: 'text', sender: 'received', name: 'Mars', text: 'Speaking of parasites... Earth, I got another wheeled robot. They keep digging holes in my desert looking for water. But there is no water! It\'s just dust! I\'ve been saying this for three billion years!', time: '12:05' },
      { type: 'image', sender: 'received', name: 'Mars', text: '📷 <i>Curiosity rover chilling in the Martian dust</i>', img: '1000076059.jpg', time: '12:05' },
      { type: 'text', sender: 'sent', name: 'Earth', text: 'Don\'t blame me, I don\'t drive them. They do it themselves. Besides, one of them took a sunset photo the other day and it was objectively gorgeous.', time: '12:06' },
      { type: 'text', sender: 'received', name: 'Jupiter', text: 'Ahahaha. Look at the cute little rocky planets. You\'re so small I could fit all of you inside my Great Red Spot and still have room for three moons.', time: '12:07' },
      { type: 'image', sender: 'received', name: 'Jupiter', text: '🌀 <i>The giant spinning storm in high definition</i>', img: '1000076063.gif', time: '12:07' },
      { type: 'text', sender: 'received', name: 'Saturn', text: 'Hey big guy, speak for yourself. Look at my rings. Pure, magnificent, shining ice crystals. Nobody has fashion accessories like mine within ten astronomical units.', time: '12:08' },
      { type: 'text', sender: 'received', name: 'Uranus', text: 'Guys... have you ever thought about how we\'re all just spinning in circles around a giant ball of fire for no real reason?', time: '12:09' },
      { type: 'text', sender: 'received', name: 'Neptune', text: 'Yeah... and it\'s freezing out here. I can\'t feel my fingers. Oh wait, I don\'t have fingers.', time: '12:10' },
      { type: 'text', sender: 'received', name: 'The Sun [Admin]', text: 'Mercury, minus 5 reputation points for the noise. Behave or I\'ll shut down nuclear fusion.<br>🚫 <i>[Black UNO reverse/prohibition card]</i>', time: '12:11' },
      { type: 'text', sender: 'sent', name: 'Earth', text: '...does anyone have an aspirin? I think global warming is doing weird things.', time: '12:12' },
      { type: 'text', sender: 'received', name: 'Mars', text: 'Serves you right for being so picky with liquid water. Go buy an AC unit.', time: '12:13' },
      { type: 'text', sender: 'received', name: 'Jupiter', text: 'Speaking of warming... Earth, your tenants sent another noisy piece of iron out this morning. It flew past Ganymede and made a super annoying beep.', time: '12:14' },
      { type: 'text', sender: 'sent', name: 'Earth', text: 'Really? Where is it going?', time: '12:15' },
      { type: 'text', sender: 'received', name: 'Jupiter', text: 'Dunno, looks like it\'s leaving the solar system. Say goodbye to your kids, they\'re all grown up and want to explore the universe.', time: '12:16' },
      { type: 'text', sender: 'received', name: 'Venus', text: 'So cute, thinking they can go anywhere with that fossil fuel tech. Fools.', time: '12:17' },
      { type: 'text', sender: 'received', name: 'Uranus', text: 'By the way, what happened to Pluto? Why does he never write in the chat?', time: '12:18' },
      { type: 'text', sender: 'received', name: 'Saturn', text: 'He got kicked out of the group because he didn\'t meet the minimum mass requirements. Now he hangs out at the Kuiper Belt Club drinking frozen methane cocktails with his weird friends.', time: '12:19' },
      { type: 'text', sender: 'received', name: 'Neptune', text: 'Ah, so I\'m not the only one ignored at galaxy meetups. Good to know.', time: '12:20' },
      { type: 'text', sender: 'received', name: 'Mercury', text: 'Guys, I have a rotation lock. I\'m spinning terribly, I feel so nauseous. Sun, can I take a break? Just one hour of total darkness?', time: '12:21' },
      { type: 'text', sender: 'received', name: 'The Sun [Admin]', text: 'Breaks don\'t exist in deep space, Mercury. Keep spinning.', time: '12:22' },
      { type: 'text', sender: 'received', name: 'Mars', text: 'Hey Sun, instead of playing UV dictator, did you check if my ice caps grew this year? I\'ve been on a strict solid carbon dioxide diet.', time: '12:23' },
      { type: 'text', sender: 'received', name: 'The Sun [Admin]', text: 'I don\'t look at your dust, Mars. I have a nebula to manage three light-years away.', time: '12:24' },
      { type: 'image', sender: 'received', name: 'The Sun [Admin]', text: '🌌 <i>Pillars of Creation flex</i>', img: '1000076061.jpg', time: '12:24' },
      { type: 'text', sender: 'sent', name: 'Earth', text: 'Guys seriously, there\'s a giant asteroid heading straight for the Pacific. Can someone help me deflect it?', time: '12:25' },
      { type: 'text', sender: 'received', name: 'Jupiter', text: 'Don\'t worry Earth, I got it with my gravity. Puff... done. I redirected it toward Venus.', time: '12:26' },
      { type: 'text', sender: 'received', name: 'Venus', text: 'WHAT?! ARE YOU INSANE?! IT MISSED ME BY AN INCH! I ALMOST RUINED MY FINISH!', time: '12:27' },
      { type: 'text', sender: 'received', name: 'Jupiter', text: 'Oops. My mass slipped. Ahahaha.', time: '12:28' },
      { type: 'text', sender: 'received', name: 'Uranus', text: 'Guys, I\'ve been rolling on my side for four billion years and nobody ever tells me "Uranus, get comfortable". You\'re terrible neighbors.', time: '12:29' },
      { type: 'text', sender: 'received', name: 'Neptune', text: 'I feel you bro. It\'s so quiet out here I can actually hear my own rings freezing.', time: '12:30' },
      { type: 'text', sender: 'sent', name: 'Earth', text: 'Well, I\'m turning off the lights. My humans are sleeping and it\'s dead boring. Tomorrow I might invent another ice age just to spice things up.', time: '12:31' },
      { type: 'text', sender: 'received', name: 'Mars', text: 'Let me know if you find a good deal on used rovers. My porch is full of them. Night rocks.', time: '12:32' }
    ];

    const chatBox = document.getElementById('chatBox');
    const finalBanner = document.getElementById('finalBanner');
    const menuToggle = document.getElementById('menuToggle');
    const dropdownMenu = document.getElementById('dropdownMenu');
    const instantReadBtn = document.getElementById('instantReadBtn');

    let animationTimeouts = [];
    let isFullyLoaded = false;

    // Gestione apertura menu a tendina
    menuToggle.addEventListener('click', (e) => {
      e.stopPropagation();
      dropdownMenu.classList.toggle('active');
    });

    document.addEventListener('click', () => {
      dropdownMenu.classList.remove('active');
    });

    function createMessageElement(msg) {
      const msgDiv = document.createElement('div');
      
      if (msg.type === 'system') {
        msgDiv.style.textAlign = 'center';
        msgDiv.style.fontSize = '12px';
        msgDiv.style.color = '#F0E8D5';
        msgDiv.style.opacity = '0.85';
        msgDiv.style.margin = '8px 0';
        msgDiv.style.width = '100%';
        msgDiv.style.textShadow = '1px 1px 2px #000';
        msgDiv.innerHTML = `<i>${msg.text}</i>`;
      } else {
        msgDiv.classList.add('message-row', msg.sender);
        let imgFileName = profileImages[msg.name] || 'planet.png';

        let innerContent = `<div>${msg.text}</div>`;
        if (msg.type === 'image') {
          innerContent += `<img src="${msg.img}" alt="Chat Image" class="message-img" onerror="this.src='https://via.placeholder.com/220x140/111/F0E8D5?text=Image';">`;
        }

        msgDiv.innerHTML = `
          <div class="msg-avatar">
            <img src="${imgFileName}" alt="${msg.name}" onerror="this.style.display='none'; this.parentNode.innerText='${msg.name.substring(0,3).toUpperCase()}';">
          </div>
          <div class="message-content">
            <div class="sender-name">${msg.name}</div>
            <div class="message-bubble">
              ${innerContent}
              <div class="timestamp">${msg.time}</div>
            </div>
          </div>
        `;
      }
      return msgDiv;
    }

    // Funzione per caricare la chat progressivamente
    function startProgressiveLoading() {
      chatBox.innerHTML = '';
      finalBanner.classList.remove('visible');
      animationTimeouts.forEach(t => clearTimeout(t));
      animationTimeouts = [];
      isFullyLoaded = false;

      let delays = [
        400, 1400, 2600, 3800, 5000, 6300, 7500, 8800, 10100, 11300, 
        12600, 13900, 15100, 16500, 17800, 19100, 20400, 21600, 22900, 
        24200, 25500, 26800, 28000, 29300, 30600, 31900, 33200, 34400, 
        35700, 37000, 38300, 39500, 40800, 42100, 43400, 44700
      ];

      messagesData.forEach((msg, index) => {
        let msgDiv = createMessageElement(msg);
        chatBox.appendChild(msgDiv);

        let t = setTimeout(() => {
          msgDiv.classList.add('visible');
          chatBox.scrollTop = chatBox.scrollHeight;
        }, delays[index] || (index * 1200));
        
        animationTimeouts.push(t);
      });

      let finalT = setTimeout(() => {
        finalBanner.classList.add('visible');
        chatBox.scrollTop = chatBox.scrollHeight;
        isFullyLoaded = true;
      }, 46000);
      animationTimeouts.push(finalT);
    }

    // Funzione per mostrare subito tutta la chat (spegne l'effetto animato)
    instantReadBtn.addEventListener('click', () => {
      animationTimeouts.forEach(t => clearTimeout(t));
      animationTimeouts = [];
      chatBox.innerHTML = '';

      messagesData.forEach((msg) => {
        let msgDiv = createMessageElement(msg);
        msgDiv.classList.add('visible');
        chatBox.appendChild(msgDiv);
      });

      finalBanner.classList.add('visible');
      chatBox.scrollTop = chatBox.scrollHeight;
      isFullyLoaded = true;
    });

    // Avvio automatico all'apertura della pagina
    startProgressiveLoading();
  </script>
</body>
</html>
